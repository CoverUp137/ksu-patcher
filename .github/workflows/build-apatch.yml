name: Build APatch Patched Images

# 流程：固件直链 -> 下载 -> 解包提取分区 -> APatch(KernelPatch) 修补 -> 校验 -> 发布 Release
# 说明：APatch 修补的是内核，通常只需要 boot 分区（init_boot / vendor_boot 不含内核，无法修补）。
on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: '固件直链（可多个，换行或逗号分隔）'
        required: true
        type: string
      partitions:
        description: '要提取的分区 img（逗号分隔，默认只取 boot）'
        required: false
        default: 'boot'
        type: string
      patch_partitions:
        description: '要修补的分区（留空 = 同上）'
        required: false
        default: ''
        type: string
      superkey:
        description: 'APatch SuperKey（可选；8~63 位含字母数字。留空 = 不校验 SuperKey，也可用 Secret APATCH_SUPERKEY）'
        required: false
        default: ''
        type: string
      kernelpatch_version:
        description: 'KernelPatch 版本（auto = 跟随 APatch 上游打包版本）'
        required: false
        default: 'auto'
        type: string
      apatch_version:
        description: 'APatch 管理器版本（仅用于命名/说明，latest = 最新）'
        required: false
        default: 'latest'
        type: string
      release_tag:
        description: '自定义 Release tag（留空自动生成）'
        required: false
        default: ''
        type: string
      allow_no_kallsyms:
        description: '内核未开启 CONFIG_KALLSYMS 时仍强制修补（多半无法开机）'
        required: false
        default: false
        type: boolean
      extract_all:
        description: '提取 payload 内全部分区（体积较大）'
        required: false
        default: false
        type: boolean
      create_release:
        description: '是否创建 Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 释放磁盘空间
        run: |
          echo "清理前:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/system-images \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          echo "清理后:"; df -h /

      - name: 解析构建参数
        id: cfg
        env:
          IN_FIRMWARE: ${{ inputs.firmware_url }}
          IN_PARTITIONS: ${{ inputs.partitions }}
          IN_PATCH: ${{ inputs.patch_partitions }}
          IN_SUPERKEY: ${{ inputs.superkey }}
          SECRET_SUPERKEY: ${{ secrets.APATCH_SUPERKEY }}
          IN_EXTRACT_ALL: ${{ inputs.extract_all }}
          IN_RELEASE: ${{ inputs.create_release }}
          IN_KALLSYMS: ${{ inputs.allow_no_kallsyms }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_URL: ${{ vars.DEFAULT_FIRMWARE_URL }}
        run: |
          set -euo pipefail

          FIRMWARE="${IN_FIRMWARE:-${DEFAULT_URL:-}}"
          if [ -z "$FIRMWARE" ]; then
            echo "::error::未提供固件直链。请填写 firmware_url，"
            echo "::error::或在 Settings > Secrets and variables > Actions > Variables"
            echo "::error::中配置 DEFAULT_FIRMWARE_URL。"
            exit 1
          fi

          PARTITIONS="${IN_PARTITIONS:-boot}"
          PATCH="${IN_PATCH:-$PARTITIONS}"

          # SuperKey：Secret 优先（公开仓库不要用输入框，会被记录在 run 事件里）
          KEY="${SECRET_SUPERKEY:-$IN_SUPERKEY}"
          if [ -n "${IN_SUPERKEY:-}" ] && [ "${REPO_PRIVATE:-true}" != "true" ]; then
            echo "::warning::仓库是公开的：从输入框传入的 SuperKey 会记录在 run 事件里，"
            echo "::warning::建议改用 Secret APATCH_SUPERKEY（本次仍然继续，密钥已打码）。"
          fi
          if [ -z "$KEY" ]; then
            echo "::warning::未提供 SuperKey：将按「不校验 SuperKey」模式修补，"
            echo "::warning::开机后 APatch 不需要密钥即可拿到 root，请自行权衡。"
          else
            echo "::add-mask::$KEY"

            # 用脚本内的同一套规则校验，避免两处实现不一致
            KEY_ERR=$(KEY="$KEY" python3 - <<'PY'
            import os, sys
            sys.path.insert(0, "scripts")
            from patch_apatch import validate_superkey
            print(validate_superkey(os.environ.get("KEY", "")) or "")
            PY
            )
            if [ -n "$KEY_ERR" ]; then
              echo "::error::SuperKey 无效：$KEY_ERR"
              exit 1
            fi
          fi

          UNPACK_FLAGS=""
          [ "${IN_EXTRACT_ALL:-false}" = "true" ] && UNPACK_FLAGS="$UNPACK_FLAGS --extract-all"

          PATCH_FLAGS=""
          [ "${IN_KALLSYMS:-false}" = "true" ] && PATCH_FLAGS="$PATCH_FLAGS --allow-no-kallsyms"

          {
            echo "firmware<<__EOF__"
            echo "$FIRMWARE"
            echo "__EOF__"
            echo "partitions=$PARTITIONS"
            echo "patch_partitions=$PATCH"
            echo "release=${IN_RELEASE:-true}"
            echo "unpack_flags=$UNPACK_FLAGS"
            echo "patch_flags=$PATCH_FLAGS"
          } >> "$GITHUB_OUTPUT"

          echo "提取分区: $PARTITIONS"
          echo "修补分区: $PATCH"
          echo "解包附加参数: ${UNPACK_FLAGS:-（无）}"
          echo "修补附加参数: ${PATCH_FLAGS:-（无）}"

      - name: 安装工具
        run: python3 scripts/setup_tools.py

      - name: 获取 APatch / KernelPatch 工具链
        id: apatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch_apatch.py \
            --kp-version '${{ inputs.kernelpatch_version }}' \
            --apatch-version '${{ inputs.apatch_version }}' \
            --out-dir tools

      - name: 生成 Release tag
        id: tag
        env:
          IN_TAG: ${{ inputs.release_tag }}
          KP: ${{ steps.apatch.outputs.kernelpatch_version }}
          FIRMWARE: ${{ steps.cfg.outputs.firmware }}
        run: |
          set -euo pipefail
          if [ -n "${IN_TAG:-}" ]; then
            TAG="$IN_TAG"
          else
            FINGERPRINT=$(printf '%s' "$FIRMWARE" | sha256sum | cut -c1-6)
            TAG="apatch-${KP}-$(date -u +%Y%m%d)-${FINGERPRINT}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: 下载固件
        id: dl
        env:
          FIRMWARE: ${{ steps.cfg.outputs.firmware }}
        run: |
          python3 scripts/download.py \
            --urls "$FIRMWARE" \
            --out-dir downloads

      - name: 解包并提取分区
        id: unpack
        run: |
          python3 scripts/unpack.py \
            --input downloads \
            --out-dir work/unpacked \
            --partitions '${{ steps.cfg.outputs.partitions }}' \
            ${{ steps.cfg.outputs.unpack_flags }}

      - name: APatch 修补镜像
        id: patch
        env:
          TARGETS: ${{ steps.unpack.outputs.targets_json }}
          PATCH_PARTITIONS: ${{ steps.cfg.outputs.patch_partitions }}
          PATCH_FLAGS: ${{ steps.cfg.outputs.patch_flags }}
          KP_VER: ${{ steps.apatch.outputs.kernelpatch_version }}
          SUPERKEY: ${{ secrets.APATCH_SUPERKEY }}
          SUPERKEY_INPUT: ${{ inputs.superkey }}
        run: |
          set -euo pipefail

          IMAGES=$(python3 - <<'PY'
          import json, os
          targets = json.loads(os.environ.get("TARGETS") or "[]")
          print(",".join(targets))
          PY
          )
          if [ -z "$IMAGES" ]; then
            echo "::error::没有提取到任何镜像，无法修补。"
            echo "::error::请检查 'partitions' 输入与固件内容是否匹配（APatch 需要 boot 分区）。"
            exit 1
          fi

          KEY="${SUPERKEY:-$SUPERKEY_INPUT}"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
          fi

          python3 scripts/patch_apatch.py \
            --images "$IMAGES" \
            --patch-partitions "$PATCH_PARTITIONS" \
            --out-dir work/patched \
            --version "$KP_VER" \
            --superkey "$KEY" \
            $PATCH_FLAGS

      - name: 校验修补结果
        run: |
          python3 scripts/verify.py \
            --mode apatch \
            --strict \
            --patched '${{ steps.patch.outputs.patched_files }}'

      - name: 整理发布产物
        id: rel
        env:
          PATCHED: ${{ steps.patch.outputs.patched_files }}
          PARTITIONS_JSON: ${{ steps.unpack.outputs.partitions_json }}
          WANT: ${{ steps.cfg.outputs.partitions }}
          KP_VER: ${{ steps.apatch.outputs.kernelpatch_version }}
          KPIMG: ${{ steps.patch.outputs.kpimg_version }}
          FIRMWARE: ${{ steps.cfg.outputs.firmware }}
        run: |
          set -euo pipefail

          # 收集需要一并发布的原始分区
          EXTRA=$(python3 - <<'PY'
          import json, os
          index = json.loads(os.environ.get("PARTITIONS_JSON") or "{}")
          want = [p.strip().lower() for p in os.environ["WANT"].split(",") if p.strip()]
          picked = [path for name, path in index.items()
                    if any(w == name.lower() or w in name.lower() for w in want)]
          print(",".join(picked))
          PY
          )

          python3 scripts/release.py \
            --tool apatch \
            --patched "$PATCHED" \
            --partitions "$EXTRA" \
            --out-dir release \
            --version "$KP_VER" \
            --firmware "$FIRMWARE"

          echo "kpimg=$KPIMG" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: apatch-${{ steps.tag.outputs.tag }}
          path: release/**
          if-no-files-found: error
          retention-days: 14

      - name: 生成 Release 说明
        env:
          KP_VER: ${{ steps.apatch.outputs.kernelpatch_version }}
          APATCH_VER: ${{ steps.apatch.outputs.apatch_version }}
          KPIMG: ${{ steps.patch.outputs.kpimg_version }}
          SKEY_MODE: ${{ steps.patch.outputs.superkey_mode }}
          FIRMWARE: ${{ steps.cfg.outputs.firmware }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/gen_notes.py \
            --manifest release/manifest.json \
            --tag "$TAG" \
            --tool apatch \
            --version "$KP_VER" \
            --apatch "$APATCH_VER" \
            --kpimg "$KPIMG" \
            --superkey-mode "$SKEY_MODE" \
            --arch arm64 \
            --firmware "$FIRMWARE" \
            --out release/RELEASE_NOTES.md

      - name: 发布 Release
        if: ${{ steps.cfg.outputs.release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/patched/*.img
            release/partitions/*.img
            release/SHA256SUMS.txt
            release/manifest.json
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: 输出摘要
        run: |
          {
            echo "## 构建完成（APatch）"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| APatch 管理器 | \`${{ steps.apatch.outputs.apatch_version }}\` |"
            echo "| KernelPatch | \`${{ steps.apatch.outputs.kernelpatch_version }}\` |"
            echo "| kpimg | \`${{ steps.apatch.outputs.kpimg_version }}\` |"
            echo "| 架构 | \`arm64\` |"
            echo "| 修补成功 | ${{ steps.patch.outputs.patched_count }} 个 |"
            echo "| 失败 | ${{ steps.patch.outputs.failed_count }} 个 |"
            echo "| SuperKey 校验 | ${{ steps.patch.outputs.superkey_mode == 'with' && '已启用' || '未启用（不校验）' }} |"
            echo "| Release tag | \`${{ steps.tag.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
